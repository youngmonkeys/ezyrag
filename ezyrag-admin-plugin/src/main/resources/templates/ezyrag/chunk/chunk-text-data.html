<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <div class="col-12">
        <form id="chunkTextDataForm" onsubmit="return false;">
            <div class="form-group row">
                <div class="col-12">
                    <label id="contentErrorLabel" class="col-form-label text-danger d-none"
                           for="chunkTextDataContent">
                        <i class="far fa-times-circle"></i> <span id="contentError">[[#{invalid}]]</span>
                    </label>
                    <textarea name="content" id="chunkTextDataContent"
                              class="form-control" th:placeholder="#{content}"
                              rows="5"></textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-md-10">
                    <button type="button" class="btn btn-primary"
                            onclick="ezyrag.chunkTextData();">
                        [[#{submit}]]
                    </button>
                </div>
            </div>
        </form>
    </div>
</th:block>
<script th:fragment="scripts">
ezyrag.chunkTextData = function() {
    var formData = ezyadmin.formDataToObject('chunkTextDataForm');
    formData.sourceType = 'TEXT';
    ezyrag.chunkData(formData);
}
</script>
</body>
</html>
