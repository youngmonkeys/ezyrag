<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <div class="col-12">
        <form id="chunkTextDataForm" onsubmit="return false;">
            <div class="form-group row">
                <label for="chunkDataSourceType" class="col-md-2 col-form-label">
                    [[#{source_type}]]
                </label>
                <div class="col-md-10">
                    <label id="sourceTypeErrorLabel" class="col-form-label text-danger d-none"
                           for="chunkDataSourceType">
                        <i class="far fa-times-circle"></i> <span id="sourceTypeError">[[#{invalid}]]</span>
                    </label>
                    <select name="sourceType" id="chunkDataSourceType"
                            class="form-control"
                            onchange="ezyrag.onChunkDataSourceTypeChanged(true);">
                        <option th:each="dataSourceType : ${dataSourceTypes}"
                                th:value="${dataSourceType}">
                            [[#{${dataSourceType.toLowerCase()}}]]
                        </option>
                    </select>
                </div>
            </div>
            <div id="chunkDataSourceIdInput" class="form-group row">
                <label for="chunkDataPostId" class="col-md-2 col-form-label">
                    [[#{source_id}]]
                </label>
                <div class="col-md-10">
                    <div id="chunkDataPostInput">
                        <label id="postIdErrorLabel" class="col-form-label text-danger d-none"
                               for="chunkDataPostId">
                            <i class="far fa-times-circle"></i> <span id="postIdError">[[#{invalid}]]</span>
                        </label>
                        <input type="text" name="postId" id="chunkDataPostId"
                               class="form-control" th:placeholder="#{post}"
                               autocomplete="off" inputmode="text"
                               onkeydown="ezyrag.onKeyDownToChunkData();">
                    </div>
                    <div id="chunkDataProductInput">
                        <label id="productIdErrorLabel" class="col-form-label text-danger d-none"
                               for="chunkDataProductId">
                            <i class="far fa-times-circle"></i> <span id="productIdError">[[#{invalid}]]</span>
                        </label>
                        <input type="text" name="productId" id="chunkDataProductId"
                               class="form-control" th:placeholder="#{product}"
                               autocomplete="off" inputmode="text"
                               onkeydown="ezyrag.onKeyDownToChunkData();">
                    </div>
                    <div id="chunkDataMediaInput">
                        <label id="mediaIdErrorLabel" class="col-form-label text-danger d-none"
                               for="chunkDataMediaId">
                            <i class="far fa-times-circle"></i> <span id="mediaIdError">[[#{invalid}]]</span>
                        </label>
                        <div class="input-group">
                            <input type="text" name="mediaId" id="chunkDataMediaId"
                                   class="form-control" th:placeholder="#{media}"
                                   readonly>
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-primary"
                                        onclick="ezyrag.showChunkDataMediaModal();">
                                    [[#{select}]]
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="chunkDataTextInput" class="form-group row">
                <label for="chunkTextDataContent" class="col-md-2 col-form-label">
                    [[#{content}]]
                </label>
                <div class="col-md-10">
                    <label id="contentErrorLabel" class="col-form-label text-danger d-none"
                           for="chunkTextDataContent">
                        <i class="far fa-times-circle"></i> <span id="contentError">[[#{invalid}]]</span>
                    </label>
                    <textarea name="data" id="chunkTextDataContent"
                              class="form-control" th:placeholder="#{content}"
                              rows="5"></textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-md-2"></div>
                <div class="col-md-10">
                    <button type="button" class="btn btn-primary px-5"
                            onclick="ezyrag.chunkTextData();">
                        [[#{submit}]]
                    </button>
                </div>
            </div>
        </form>
    </div>
</th:block>
<script th:fragment="scripts">
ezyrag.dataSourceTypes = {
    MEDIA: 'ezy_medias',
    POST: 'ezyarticle_posts',
    PRODUCT: 'ecommerce_products',
    TEXT: 'TEXT'
};

ezyrag.getChunkDataSourceType = function() {
    return $('#chunkDataSourceType').val();
}

ezyrag.onChunkDataSourceTypeChanged = function(openMediaModal) {
    var sourceType = ezyrag.getChunkDataSourceType();
    $('#chunkDataPostInput').toggleClass(
        'd-none',
        !ezyrag.isChunkDataPostSourceType(sourceType)
    );
    $('#chunkDataProductInput').toggleClass(
        'd-none',
        !ezyrag.isChunkDataProductSourceType(sourceType)
    );
    $('#chunkDataMediaInput').toggleClass(
        'd-none',
        !ezyrag.isChunkDataMediaSourceType(sourceType)
    );
    var hasVisibleSourceId =
        ezyrag.isChunkDataPostSourceType(sourceType) ||
        ezyrag.isChunkDataProductSourceType(sourceType) ||
        ezyrag.isChunkDataMediaSourceType(sourceType);
    var isMediaSource = ezyrag.isChunkDataMediaSourceType(sourceType);
    $('#chunkDataTextInput').toggleClass(
        'd-none',
        hasVisibleSourceId || isMediaSource
    );
    $('#chunkDataSourceIdInput').toggleClass(
        'd-none',
        !hasVisibleSourceId
    );
    if (openMediaModal && isMediaSource) {
        ezyrag.showChunkDataMediaModal();
    }
}

ezyrag.isChunkDataPostSourceType = function(sourceType) {
    sourceType = (sourceType || '').toLowerCase();
    return sourceType == ezyrag.dataSourceTypes.POST ||
        sourceType.indexOf('post') >= 0;
}

ezyrag.isChunkDataProductSourceType = function(sourceType) {
    sourceType = (sourceType || '').toLowerCase();
    return sourceType == ezyrag.dataSourceTypes.PRODUCT ||
        sourceType.indexOf('product') >= 0;
}

ezyrag.isChunkDataMediaSourceType = function(sourceType) {
    sourceType = (sourceType || '').toLowerCase();
    return sourceType == ezyrag.dataSourceTypes.MEDIA ||
        sourceType.indexOf('media') >= 0;
}

ezyrag.showChunkDataMediaModal = function() {
    ezyadmin
        .showMediaModal('chunkDataMedia')
        .onMediaSelected(function(media) {
            if (media) {
                ezyrag.selectedChunkDataMedia = media;
                ezyrag.setChunkDataMediaInput(media);
            }
            ezyadmin.closeMediaModal();
        });
}

ezyrag.setChunkDataMediaInput = function(media) {
    var displayName = media.originalName || media.title || media.name || '';
    $('#chunkDataMediaId').val(
        displayName
            ? displayName + '<' + media.id + '>'
            : media.id
    );
}

ezyrag.onKeyDownToChunkData = function() {
    if(event.key === 'Enter') {
        ezyrag.chunkTextData();
    }
}

ezyrag.chunkTextData = function() {
    var formData = ezyadmin.formDataToObject('chunkTextDataForm');
    if (ezyrag.isChunkDataPostSourceType(formData.sourceType)) {
        formData.sourceId = ezyrag.getChunkDataAutocompleteId('chunkDataPostId');
    } else if (ezyrag.isChunkDataProductSourceType(formData.sourceType)) {
        formData.sourceId = ezyrag.getChunkDataAutocompleteId('chunkDataProductId');
    } else if (ezyrag.isChunkDataMediaSourceType(formData.sourceType)) {
        formData.sourceId = ezyrag.getChunkDataMediaId();
    }
    delete formData.postId;
    delete formData.productId;
    delete formData.mediaId;
    ezyrag.chunkData(formData);
}

ezyrag.getChunkDataAutocompleteId = function(inputId) {
    var value = $('#' + inputId).val();
    if (!value) {
        return 0;
    }
    var from = value.lastIndexOf('<');
    var to = value.lastIndexOf('>');
    return from >= 0 && to > from
        ? value.substring(from + 1, to)
        : value;
}

ezyrag.getChunkDataMediaId = function() {
    var value = $('#chunkDataMediaId').val();
    if (!value) {
        return 0;
    }
    var from = value.lastIndexOf('<');
    var to = value.lastIndexOf('>');
    return from >= 0 && to > from
        ? value.substring(from + 1, to)
        : value;
}

$(document).ready(function() {
    ezyarticle.registerPostTitleAutocomplete('chunkDataPostId');
    ecommerce.registerProductIdAutocomplete('chunkDataProductId');
    ezyrag.onChunkDataSourceTypeChanged();
});
</script>
</body>
</html>
