<!DOCTYPE html>
<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{ezyadmin}">
<body>
<div layout:fragment="content" class="row">
    <div class="col-12">
        <table id="embeddingServiceList" class="table table-bordered table-hover bg-white align-middle-cells">
            <thead>
            <tr>
                <th class="text-center pl-2p5">#</th>
                <th>[[#{name}]]</th>
                <th class="text-center">[[#{active}]]</th>
                <th class="text-center">[[#{actions}]]</th>
            </tr>
            </thead>
            <tbody id="embeddingServiceListBody">
            <tr th:each="embeddingServiceName, iterator : ${embeddingServiceNames}">
                <td class="text-center pl-2p5">[[${iterator.index + 1}]]</td>
                <td>
                    <a th:href="${'/ezyrag/embedding-services/' + embeddingServiceName}">
                        [[${embeddingServiceName}]]
                    </a>
                </td>
                <td class="text-center">
                    <button type="button"
                            th:if="${embeddingServiceName != defaultEmbeddingServiceName}"
                            class="btn btn-link pt-0"
                            th:attr="onclick=|ezyrag.setDefaultEmbeddingService('${embeddingServiceName}')|">
                        [[#{set_as}]]
                    </button>
                    <button type="button"
                            th:if="${embeddingServiceName == defaultEmbeddingServiceName}"
                            class="btn btn-link text-success pt-0">
                        [[#{default}]]
                    </button>
                </td>
                <td class="text-center">
                    <a th:href="${'/ezyrag/embedding-services/' + embeddingServiceName}">
                        <i class="fas fa-eye text-info"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script layout:fragment="scripts">
$(document).ready(() => {
    ezyadmin.createDataTable('embeddingServiceList', 12);
});

ezyrag.setDefaultEmbeddingService = function(serviceName) {
    $.ajax({
        type: 'PUT',
        url: `/ezyrag/api/v1/embedding-services/${serviceName}/set-as-default`,
        success: function () {
            window.location = '/ezyrag/embedding-services'
                + (ezyadmin.lang ? '?lang=' + ezyadmin.lang : '');
        },
        error: function (e) {
            ezyadmin.processGetApiErrors(e);
        }
    });
}
</script>
</body>
</html>
