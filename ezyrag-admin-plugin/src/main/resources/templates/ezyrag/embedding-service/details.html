<!DOCTYPE html>
<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{ezyadmin}">
<head>
    <script>
        var ezyrag = {};
    </script>
</head>

<body>
<div layout:fragment="content" class="row">
    <div class="col-md-3">
        <label>[[#{service_name}]]:</label>
    </div>
    <div class="col-md-9">
        [[${embeddingServiceName}]]
    </div>
    <div class="col-12">
        <hr>
    </div>
    <div class="col-12">
        <form id="updateEmbeddingServiceForm" onsubmit="return false;">
            <div class="form-group row">
                <label for="model" class="col-md-3 col-form-label">
                    [[#{open_ai_embedding_model}]] (<span class="text-danger">*</span>)
                </label>
                <div class="col-lg-7 col-md-6">
                    <select name="model" id="model" class="form-control">
                        <option value="">[[#{select}]]</option>
                    </select>
                    <input type="text" name="model" id="modelInput"
                           class="form-control d-none" disabled
                           th:placeholder="#{open_ai_embedding_model}"
                           th:value="${openAiEmbeddingModel}">
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input wh-1rem" id="enterModelManually"
                               onchange="ezyrag.toggleModelInputMode(this.checked);">
                        <label class="form-check-label" for="enterModelManually">
                            [[#{enter_model_manually}]]
                        </label>
                    </div>
                </div>
                <label id="modelErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="model">
                    <i class="far fa-times-circle"></i> <span id="modelError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="apiKey" class="col-md-3 col-form-label">
                    [[#{open_ai_api_key}]] (<span class="text-danger">*</span>)
                </label>
                <div class="col-lg-7 col-md-6">
                    <input type="password" name="apiKey" id="apiKey"
                           class="form-control" th:placeholder="#{open_ai_api_key}"
                           autocomplete="new-password"
                           th:value="${openAiApiKeyValue}">
                    <small class="form-text text-muted">
                        [[#{api_key_keep_hint}]]
                    </small>
                </div>
                <label id="apiKeyErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="apiKey">
                    <i class="far fa-times-circle"></i> <span id="apiKeyError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-primary btn-block"
                            onclick="ezyrag.saveEmbeddingService();">
                        [[#{save}]]
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script layout:fragment="scripts" th:inline="javascript">
/*<![CDATA[*/
ezyrag.embeddingServiceName = /*[[${embeddingServiceName}]]*/ '';
ezyrag.openAiEmbeddingModel = /*[[${openAiEmbeddingModel}]]*/ '';
ezyadmin.messages.select = /*[[#{select}]]*/ '';
/*]]>*/

ezyrag.saveEmbeddingService = function() {
    var formData = ezyadmin.formDataToObject('updateEmbeddingServiceForm');
    $.ajax({
        type: 'PUT',
        url: `/ezyrag/api/v1/embedding-services/${ezyrag.embeddingServiceName}/settings`,
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function () {
            ezyadmin.hideFormErrors(formData);
            ezyadmin.shortToast('bg-success', ezyadmin.messages.save_successfully);
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

ezyrag.loadModelNames = function() {
    $.ajax({
        type: 'GET',
        url: `/ezyrag/api/v1/embedding-services/${ezyrag.embeddingServiceName}/model-names`,
        dataType: 'json',
        success: function (modelNames) {
            var currentModel = $('#model').val();
            var options = `<option value="">${ezyadmin.messages.select}</option>`;
            (modelNames || []).forEach(function (modelName) {
                options += `<option value="${ezyadmin.escapeHtml(modelName)}"${ezyrag.openAiEmbeddingModel == modelName ? ' selected' : ''}>
                    ${ezyadmin.escapeHtml(modelName)}
                </option>`;
            });
            $('#model').html(options);
            if (currentModel) {
                $('#model').val(currentModel);
            }
        },
        error: function (data, e) {
            ezyadmin.processGetApiErrors(data);
            $('#enterModelManually').prop('checked', true);
            ezyrag.toggleModelInputMode(true);
        }
    });
}

ezyrag.toggleModelInputMode = function(manual) {
    $('#model').toggleClass('d-none', manual).prop('disabled', manual);
    $('#modelInput').toggleClass('d-none', !manual).prop('disabled', !manual);
}

$(document).ready(function () {
    ezyrag.loadModelNames();
});
</script>
</body>
</html>
