<!DOCTYPE html>
<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{ezyadmin}">
<head>
    <script>
        var ezyrag = {};
    </script>
</head>

<body>
<div layout:fragment="content" class="row">
    <div class="col-md-3">
        <label>[[#{service_name}]]:</label>
    </div>
    <div class="col-md-9">
        [[${vectorDatabaseServiceName}]]
    </div>
    <div class="col-12">
        <hr>
    </div>
    <div class="col-12">
        <form id="updateVectorDatabaseServiceForm" onsubmit="return false;">
            <div class="form-group row">
                <label for="baseUrl" class="col-md-3 col-form-label">
                    [[#{base_url}]] (<span class="text-danger">*</span>)
                </label>
                <div class="col-lg-7 col-md-6">
                    <input type="text" name="baseUrl" id="baseUrl"
                           class="form-control" th:placeholder="#{base_url}"
                           th:value="${#strings.isEmpty(ezyVectorConnection.baseUrl) ? 'http://localhost:8080/ezyvector' : ezyVectorConnection.baseUrl}">
                    <small class="form-text text-muted">
                        [[#{ezyvector_base_url_hint}]]
                    </small>
                </div>
                <label id="baseUrlErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="baseUrl">
                    <i class="far fa-times-circle"></i> <span id="baseUrlError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="ezyVectorApiKey" class="col-md-3 col-form-label">
                    [[#{api_key}]] (<span class="text-danger">*</span>)
                </label>
                <div class="col-lg-7 col-md-6">
                    <input type="password" name="apiKey" id="ezyVectorApiKey"
                           class="form-control" th:placeholder="#{api_key}"
                           autocomplete="new-password"
                           th:value="${ezyVectorApiKey}">
                    <small class="form-text text-muted">
                        [[#{api_key_keep_hint}]]
                    </small>
                </div>
                <label id="ezyVectorApiKeyErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="ezyVectorApiKey">
                    <i class="far fa-times-circle"></i> <span id="ezyVectorApiKeyError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-primary btn-block"
                            onclick="ezyrag.saveVectorDatabaseService();">
                        [[#{save}]]
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-12">
        <hr class="mb-4" />
    </div>
    <th:block th:replace="~{ezyrag/collection/collection-list :: content}" />
    <th:block th:replace="~{ezyrag/collection/add :: content}" />
    <th:block th:replace="~{ezyrag/collection/edit :: content}" />
</div>

<script layout:fragment="scripts" th:inline="javascript">
/*<![CDATA[*/
ezyrag.vectorDatabaseServiceName = /*[[${vectorDatabaseServiceName}]]*/ '';
/*]]>*/

ezyrag.saveVectorDatabaseService = function() {
    var formData = ezyadmin.formDataToObject('updateVectorDatabaseServiceForm');
    $.ajax({
        type: 'PUT',
        url: `/ezyrag/api/v1/vector-database-services/${ezyrag.vectorDatabaseServiceName}/connection-properties`,
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function () {
            ezyadmin.hideFormErrors(formData);
            ezyadmin.shortToast('bg-success', ezyadmin.messages.save_successfully);
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}
</script>
<th:block layout:fragment="post-scripts">
    <th:block th:replace="~{ezyrag/collection/collection-list :: scripts}" />
    <th:block th:replace="~{ezyrag/collection/scripts :: add-edit}" />
</th:block>
</body>
</html>
