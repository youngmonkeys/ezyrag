<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <div class="modal fade pt-4rem" id="add-vector-collection">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="add-vector-collection-modal-title">
                        [[#{add_new_vector_collection}]]
                    </h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="addVectorCollectionForm" onsubmit="return false;">
                        <div class="form-group row">
                            <label for="addVectorCollectionName" class="col-4 col-form-label">
                                [[#{name}]] (<span class="text-danger">*</span>)
                            </label>
                            <div class="col-8">
                                <label class="col-form-label text-danger d-none"
                                       id="addVectorCollectionNameErrorLabel" for="addVectorCollectionName">
                                    <i class="far fa-times-circle"></i> <span id="addVectorCollectionNameError"></span>
                                </label>
                                <input type="text" name="name" id="addVectorCollectionName"
                                       class="form-control" th:placeholder="#{name}"
                                       value="ezyrag_vector_collection"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'add');">
                                <small class="form-text text-muted">
                                    [[#{vector_collection_name_hint}]]
                                </small>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="addVectorCollectionDisplayName" class="col-4 col-form-label">
                                [[#{display_name}]]
                            </label>
                            <div class="col-8">
                                <input type="text" name="displayName" id="addVectorCollectionDisplayName"
                                       class="form-control" th:placeholder="#{display_name}"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'add');">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="addVectorCollectionBaseUrl" class="col-4 col-form-label">
                                [[#{base_url}]]
                            </label>
                            <div class="col-8">
                                <input type="text" name="baseUrl" id="addVectorCollectionBaseUrl"
                                       class="form-control" th:placeholder="#{base_url}"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'add');">
                                <small class="form-text text-muted">
                                    [[#{vector_collection_base_url_hint}]]
                                </small>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="addVectorCollectionVectorSize" class="col-4 col-form-label">
                                [[#{vector_size}]] (<span class="text-danger">*</span>)
                            </label>
                            <div class="col-8">
                                <label class="col-form-label text-danger d-none"
                                       id="addVectorCollectionVectorSizeErrorLabel" for="addVectorCollectionVectorSize">
                                    <i class="far fa-times-circle"></i> <span id="addVectorCollectionVectorSizeError"></span>
                                </label>
                                <input type="text" name="vectorSize" id="addVectorCollectionVectorSize"
                                       class="form-control" th:placeholder="#{vector_size}"
                                       value="384"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'add');">
                                <small class="form-text text-muted">
                                    [[#{vector_size_hint}]]
                                </small>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="addVectorCollectionDistance" class="col-4 col-form-label">
                                [[#{distance}]]
                            </label>
                            <div class="col-8">
                                <input type="text" name="distance" id="addVectorCollectionDistance"
                                       class="form-control" th:placeholder="#{distance}"
                                       value="Cosine"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'add');">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer justify-content-between">
                    <div>
                        <button type="button" class="btn btn-default" data-dismiss="modal">[[#{cancel}]]</button>
                    </div>
                    <button type="button" class="btn btn-primary"
                            onclick="ezyrag.addOrEditVectorCollection('add');">
                        [[#{add}]]
                    </button>
                </div>
            </div>
            <!-- /.modal-content -->
        </div>
        <!-- /.modal-dialog -->
    </div>
</th:block>
</body>
</html>
