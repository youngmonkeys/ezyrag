<!DOCTYPE html>
<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{ezyadmin}">
<head>
    <script>
        var ezyvector = {};
    </script>
</head>
<body>
<div layout:fragment="content" class="row">
    <div class="col-12">
        <hr class="mb-4" />
    </div>
    <div class="col-12 mt-3"></div>
    <div class="col-12">
        <div class="d-flex">
            <h3>[[#{vouchers}]]</h3>
            <a th:href="${'/ezyrag/vouchers/add?shopId=' + shop.id}"
               class="btn btn-outline-primary button-next-to-title">
                [[#{add_new}]] <i class="fas fa-plus-circle"></i>
            </a>
        </div>
    </div>
    <th:block th:replace="~{ezyrag/shop/voucher/list :: content}" />
    <th:block th:replace="~{ezyvector/collection/collection-list :: content}" />
</div>
<th:block layout:fragment="scripts">
    <th:block th:replace="~{ezyvector/collection/collection-list :: scripts}" />
</th:block>
</body>
</html>
