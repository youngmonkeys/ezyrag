<html xmlns:th="http://www.thymeleaf.org">
<body>
<script th:fragment="add-edit">
// ========== show add vector collection modal =============
ezyrag.showAddVectorCollectionModal = function() {
    $('#add-vector-collection').modal('show');
}

// ========== show edit vector collection modal =============
ezyrag.showEditVectorCollectionModal = function(
    id,
    name,
    displayName,
    vectorSize,
    distance,
    status
) {
    ezyrag.selectedVectorCollectionId = id;
    $('#editVectorCollectionName').val(unescape(name));
    $('#editVectorCollectionDisplayName').val(unescape(displayName));
    $('#editVectorCollectionVectorSize').val(vectorSize);
    $('#editVectorCollectionDistance').val(unescape(distance));
    $('#editVectorCollectionStatus').val(status);
    $('#edit-vector-collection').modal('show');
}

// ========== add or edit vector collection ===========
ezyrag.onKeydownToAddOrEditVectorCollection = function(event, action) {
    if (event.key === 'Enter') {
        ezyrag.addOrEditVectorCollection(action);
    }
}

ezyrag.addOrEditVectorCollection = function(action) {
    var formData = ezyadmin.formDataToObject(action + 'VectorCollectionForm');
    formData.vectorDbService = ezyrag.vectorDatabaseServiceName;
    var url = (action == 'add')
        ? '/ezyrag/api/v1/vector-collections/add'
        : '/ezyrag/api/v1/vector-collections/' + ezyrag.selectedVectorCollectionId;
    $.ajax({
        type: action == 'add' ? 'POST' : 'PUT',
        url: url,
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function () {
            ezyadmin.hideFormErrors(formData);
            $('#' + action + '-vector-collection').modal('hide');
            ezyrag.fetchVectorCollectionList('first');
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
};
</script>
</body>
</html>
