<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <div class="modal fade pt-4rem" id="edit-vector-collection">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="edit-vector-collection-modal-title">
                        [[#{edit_vector_collection}]]
                    </h4>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="editVectorCollectionForm" onsubmit="return false;">
                        <div class="form-group row">
                            <label for="editVectorCollectionName" class="col-4 col-form-label">
                                [[#{name}]] (<span class="text-danger">*</span>)
                            </label>
                            <div class="col-8">
                                <label class="col-form-label text-danger d-none"
                                       id="editVectorCollectionNameErrorLabel" for="editVectorCollectionName">
                                    <i class="far fa-times-circle"></i> <span id="editVectorCollectionNameError"></span>
                                </label>
                                <input type="text" name="name" id="editVectorCollectionName"
                                       class="form-control" th:placeholder="#{collection_name}"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'edit');">
                                <small class="form-text text-muted">
                                    [[#{vector_collection_name_hint}]]
                                </small>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="editVectorCollectionDisplayName" class="col-4 col-form-label">
                                [[#{display_name}]]
                            </label>
                            <div class="col-8">
                                <input type="text" name="displayName" id="editVectorCollectionDisplayName"
                                       class="form-control" th:placeholder="#{display_name}"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'edit');">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="editVectorCollectionBaseUrl" class="col-4 col-form-label">
                                [[#{base_url}]]
                            </label>
                            <div class="col-8">
                                <input type="text" name="baseUrl" id="editVectorCollectionBaseUrl"
                                       class="form-control" th:placeholder="#{base_url}"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'edit');">
                                <small class="form-text text-muted">
                                    [[#{vector_collection_base_url_hint}]]
                                </small>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="editVectorCollectionVectorSize" class="col-4 col-form-label">
                                [[#{vector_size}]] (<span class="text-danger">*</span>)
                            </label>
                            <div class="col-8">
                                <label class="col-form-label text-danger d-none"
                                       id="editVectorCollectionVectorSizeErrorLabel" for="editVectorCollectionVectorSize">
                                    <i class="far fa-times-circle"></i> <span id="editVectorCollectionVectorSizeError"></span>
                                </label>
                                <input type="text" name="vectorSize" id="editVectorCollectionVectorSize"
                                       class="form-control" th:placeholder="#{vector_size}"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'edit');">
                                <small class="form-text text-muted">
                                    [[#{vector_size_hint}]]
                                </small>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="editVectorCollectionDistance" class="col-4 col-form-label">
                                [[#{distance}]]
                            </label>
                            <div class="col-8">
                                <input type="text" name="distance" id="editVectorCollectionDistance"
                                       class="form-control" th:placeholder="#{distance}"
                                       onkeydown="ezyrag.onKeydownToAddOrEditVectorCollection(event, 'edit');">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="editVectorCollectionStatus" class="col-4 col-form-label">
                                [[#{status}]]
                            </label>
                            <div class="col-8">
                                <select name="status" id="editVectorCollectionStatus" class="form-control">
                                    <option th:each="status : ${vectorCollectionStatuses}"
                                            th:value="${status}"
                                            th:text="${#messages.msg(#strings.toLowerCase(status))}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer justify-content-between">
                    <div>
                        <button type="button" class="btn btn-default" data-dismiss="modal">[[#{cancel}]]</button>
                    </div>
                    <button type="button" class="btn btn-primary"
                            onclick="ezyrag.addOrEditVectorCollection('edit');">
                        [[#{update}]]
                    </button>
                </div>
            </div>
            <!-- /.modal-content -->
        </div>
        <!-- /.modal-dialog -->
    </div>
</th:block>
</body>
</html>
