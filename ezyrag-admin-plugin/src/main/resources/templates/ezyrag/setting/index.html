<!DOCTYPE html>
<html
        lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{ezyadmin}">
<head>
    <script>
        var ezyrag = {};
    </script>
</head>

<body>
<div layout:fragment="content" class="row">
    <div class="col-md-12">
        <strong class="text-info">[[#{save_setting_hot_key_guide}]]</strong>
    </div>
    <div class="col-md-12">
        <form id="updateSettingsForm" onsubmit="return false;">
            <div class="col-12 mt-3"></div>
            <div class="form-group row">
                <label for="knowledgeDataBuilderName" class="col-sm-3 col-form-label">
                    [[#{knowledge_data_builder}]]
                </label>
                <div class="col-lg-7 col-md-6">
                    <select name="knowledgeDataBuilderName" id="knowledgeDataBuilderName"
                            class="form-control">
                        <option th:each="name : ${knowledgeDataBuilderNames}"
                                th:value="${name}"
                                th:selected="${name == knowledgeDataBuilderName}">
                            [[${name}]]
                        </option>
                    </select>
                </div>
                <label id="knowledgeDataBuilderNameErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="knowledgeDataBuilderName">
                    <i class="far fa-times-circle"></i> <span id="knowledgeDataBuilderNameError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="dataChunkerName" class="col-sm-3 col-form-label">
                    [[#{data_chunker}]]
                </label>
                <div class="col-lg-7 col-md-6">
                    <select name="dataChunkerName" id="dataChunkerName"
                            class="form-control">
                        <option th:each="name : ${dataChunkerNames}"
                                th:value="${name}"
                                th:selected="${name == dataChunkerName}">
                            [[${name}]]
                        </option>
                    </select>
                </div>
                <label id="dataChunkerNameErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="dataChunkerName">
                    <i class="far fa-times-circle"></i> <span id="dataChunkerNameError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="dataRetrieverName" class="col-sm-3 col-form-label">
                    [[#{data_retriever}]]
                </label>
                <div class="col-lg-7 col-md-6">
                    <select name="dataRetrieverName" id="dataRetrieverName"
                            class="form-control">
                        <option th:each="name : ${dataRetrieverNames}"
                                th:value="${name}"
                                th:selected="${name == dataRetrieverName}">
                            [[${name}]]
                        </option>
                    </select>
                </div>
                <label id="dataRetrieverNameErrorLabel" class="col-lg-2 col-md-3 col-form-label text-danger d-none"
                       for="dataRetrieverName">
                    <i class="far fa-times-circle"></i> <span id="dataRetrieverNameError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-2 mb-2">
                    <button type="button" class="btn btn-primary btn-block"
                            id="saveEzyRagSettingButton"
                            onclick="ezyrag.saveSettings();">
                        [[#{save}]]
                    </button>
                </div>
                <div class="col-md-5"></div>
            </div>
        </form>
    </div>
</div>

<script layout:fragment="scripts" th:inline="javascript">
/*<![CDATA[*/
ezyadmin.messages.save_successfully = /*[[#{save_successfully}]]*/;
/*]]>*/

ezyrag.saveSettings = function() {
    var formData = ezyadmin.formDataToObject('updateSettingsForm');
    $.ajax({
        type: 'PUT',
        url: '/ezyrag/api/v1/settings',
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function () {
            ezyadmin.hideFormErrors(formData);
            ezyadmin.shortToast('bg-success', ezyadmin.messages.save_successfully);
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

ezyrag.handleSettingsSaveShortcut = function(event) {
    var $form = $('#updateSettingsForm');
    var $saveButton = $('#saveEzyRagSettingButton');
    if (!$form.length || !$saveButton.length) {
        return;
    }

    var key = event.key ? event.key.toLowerCase() : '';
    var modifierPressed = event.ctrlKey || event.metaKey;
    if (key !== 's' || !modifierPressed) {
        return;
    }

    var $activeElement = $(':focus');
    var activeElement = $activeElement[0];
    var focusIsFormInput = $activeElement.length &&
        $.contains($form[0], activeElement) &&
        ($activeElement.is('input, textarea, select') || $activeElement.prop('isContentEditable'));
    var focusIsBlank = !$activeElement.length || $activeElement.is('body');

    if (!focusIsBlank && !focusIsFormInput) {
        return;
    }

    event.preventDefault();
    $saveButton.trigger('click');
};

$(document).on('keydown', ezyrag.handleSettingsSaveShortcut);
</script>
</body>
</html>
