<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Navbar -->
<div th:fragment="header" class="container-fluid main-nav">
    <div class="d-flex align-items-center">
        <div class="site-branding pl-2">
            <a href="/" class="text-white custom-logo-link" rel="home" aria-current="page">
                <img src="/images/logo.png" class="main-logo" alt="EzyAI">
            </a>
        </div><!-- .site-branding -->
        <ul class="d-none d-md-flex">
            <li class="nav-item">
                <a class="nav-link" href="/">[[#{home}]]</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/chat">[[#{chat}]]</a>
            </li>
        </ul>
    </div>
    <ul class="d-none d-md-flex">
        <li th:if="${loggedIn == true}" class="nav-item dropdown">
            <a class="nav-link" data-toggle="dropdown" href="#">
                <i class="far fa-bell"></i>
                <span class="badge badge-warning navbar-badge notification-count d-none">0</span>
            </a>
            <div class="dropdown-menu dropdown-menu-lg dropdown-menu-right">
                <span class="dropdown-item dropdown-header">
                    <span class="notification-count">0</span> [[#{notifications}]]
                </span>
                <div class="dropdown-divider" id="notificationHeaderDivider"></div>
                <a href="#" class="dropdown-item dropdown-footer" onclick="readAllNotifications();">
                    [[#{see_all_notifications}]]
                </a>
            </div>
        </li>
        <li th:if="${loggedIn != true}" class="nav-item">
            <button class="btn btn-link text-white" data-toggle="modal" data-target="#login-modal">
                [[#{login}]]
            </button>
        </li>
        <li th:if="${loggedIn == true}" class="nav-item dropdown">
            <img id="headerAvatarImage" class="rounded-circle ml-4 small-avatar cursor-pointer"
                 th:src="${avatarImage != null ? avatarImage.getUrlOrDefault('/images/avatar.png') : '/images/avatar.png'}"
                 data-toggle="dropdown">
            <div class="dropdown-menu dropdown-menu-md dropdown-menu-right">
                <a href="/account" class="dropdown-item mt-2">
                    <i class="far fa-user-circle mr-2"></i> [[#{my_profile}]]
                </a>
                <div class="dropdown-divider"></div>
                <a href="/account/inbox" class="dropdown-item">
                    <i class="fas fa-inbox mr-2"></i> [[#{inbox}]]
                    <span class="float-right text-muted text-sm letter-count">0</span>
                </a>
                <div class="dropdown-divider"></div>
                <a href="#" class="dropdown-item mb-2" onclick="ezyweb.logout();">
                    <i class="fas fa-sign-out-alt mr-2"></i> [[#{logout}]]
                </a>
            </div>
        </li>
    </ul>
    <div class="d-md-none d-flex">
        <div class="justify-content-end align-items-center">
            <button class="btn btn-link text-white" onclick="toggleMainMobileMenu();">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>
</div>

<div th:fragment="mobile-menu" class="main-mobile-menu" id="mainMobileMenu">
    <div class="d-flex justify-content-between">
        <div></div>
        <div class="site-branding mt-2">
            <a href="/" class="custom-logo-link text-white" rel="home" aria-current="page">
                <img src="/images/logo.png" class="main-logo" alt="EzyAI">
            </a>
        </div><!-- .site-branding -->
        <div class="d-flex justify-content-end">
            <button class="btn btn-link" onclick="toggleMainMobileMenu();">
                <h4><i class="text-white fas fa-times"></i></h4>
            </button>
        </div>
    </div>
    <div class="main-mobile-common-menu">
        <ul class="nav nav-pills nav-sidebar flex-column mt-3">
            <li th:if="${loggedIn == true}" class="nav-item">
                <div class="d-flex align-items-center" data-toggle="dropdown">
                    <img id="mobileHeaderAvatarImage" class="rounded-circle ml-3 small-avatar cursor-pointer"
                         th:src="${avatarImage != null ? avatarImage.getUrlOrDefault('/images/avatar.png') : '/images/avatar.png'}">
                    <label class="text-white pl-3" th:text="${user != null ? user.getName() : ''}"></label>
                </div>
                <div class="dropdown-menu dropdown-menu-md dropdown-menu-right">
                    <a href="/account" class="dropdown-item mt-2">
                        <i class="far fa-user-circle mr-2"></i> [[#{my_profile}]]
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="/account/inbox" class="dropdown-item mb-2">
                        <i class="fas fa-inbox mr-2"></i> [[#{inbox}]]
                        <span class="float-right text-muted text-sm letter-count">0</span>
                    </a>
                </div>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/">[[#{home}]]</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/chat">[[#{chat}]]</a>
            </li>
            <li th:if="${loggedIn != true}" class="nav-item">
                <button class="btn btn-link nav-link text-white" data-toggle="modal" data-target="#login-modal">
                    [[#{login}]]
                </button>
            </li>
            <li th:if="${loggedIn == true}" class="nav-item">
                <button class="btn btn-link nav-link text-white" onclick="ezyweb.logout();">
                    <i class="fas fa-sign-out-alt mr-2"></i> [[#{logout}]]
                </button>
            </li>
        </ul>
    </div>
</div>
<script th:fragment="scripts">
// ===================== common ===============
var isMainMobileMenuOpen = false;
var toggleMainMobileMenu = function() {
    $('#mainMobileMenu').css({
        '-webkit-transform': 'translate3d(' + (isMainMobileMenuOpen ? '-100%' : '0%') + ',0,0)'
    });
    isMainMobileMenuOpen = !isMainMobileMenuOpen;
}
</script>
</body>

</html>
